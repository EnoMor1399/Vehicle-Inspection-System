name: Spreadsheet parser security upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spreadsheet-parser-security-upgrade.yml"

permissions:
  contents: write

concurrency:
  group: spreadsheet-parser-security-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Prepare spreadsheet parser security upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Replace vulnerable npm xlsx package
        run: |
          npm uninstall xlsx
          npm install --save-exact @e965/xlsx@0.20.3
          node -e 'const fs=require("fs"); const p="src/app/import/ImportWizard.tsx"; const s=fs.readFileSync(p,"utf8"); fs.writeFileSync(p,s.replace("from \"xlsx\";","from \"@e965/xlsx\";"));'

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Validate ESLint
        run: npm run lint

      - name: Require zero high-severity npm advisories
        run: npm audit --audit-level=high

      - name: Commit parser and lockfile update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/app/import/ImportWizard.tsx
          git commit -m "Replace vulnerable spreadsheet parser package"
          git push origin HEAD:main
