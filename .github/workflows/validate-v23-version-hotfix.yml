name: Validate VIMS V2.3 release-version hotfix

on:
  push:
    branches:
      - hotfix/v2.3-release-version
    paths:
      - '.github/workflows/validate-v23-version-hotfix.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hotfix
        uses: actions/checkout@v4
        with:
          ref: hotfix/v2.3-release-version
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Verify release identity
        run: node -e "const p=require('./package.json'); if(p.version!=='2.3.0') throw new Error('Expected package version 2.3.0');"
