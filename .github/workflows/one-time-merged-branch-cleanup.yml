name: One-time merged branch cleanup

on:
  push:
    branches:
      - security/resolve-drizzle-esbuild-advisory

permissions:
  contents: write

concurrency:
  group: one-time-vims-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Delete only branches already merged into main
        shell: bash
        env:
          CURRENT_BRANCH: security/resolve-drizzle-esbuild-advisory
        run: |
          git fetch origin main --prune
          mapfile -t merged < <(
            git branch -r --merged origin/main |
              sed 's#^[ *]*origin/##' |
              grep -v '^HEAD ->' |
              grep -v '^main$' |
              grep -v "^${CURRENT_BRANCH}$" |
              sort -u
          )

          echo "Merged branches eligible for deletion: ${#merged[@]}"
          printf '%s\n' "${merged[@]}"

          for branch in "${merged[@]}"; do
            [[ -z "$branch" ]] && continue
            git push origin --delete "$branch"
          done
