name: Harden VIMS production mode

on:
  push:
    branches:
      - ops/remove-demo-data
    paths:
      - '.github/workflows/harden-production-mode.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/remove-demo-data
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Remove demo account and seed capabilities
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          auth = Path('src/app/login/AuthForm.tsx')
          text = auth.read_text()
          text = text.replace(
              'export function AuthForm({ hasUsers, showDemoAccounts = false }: { hasUsers: boolean; showDemoAccounts?: boolean }) {',
              'export function AuthForm() {'
          )
          demo_fn = '''\n  function fillDemo(email: string) {\n    setEmail(email);\n    setPassword("Demo-Only@2026!");\n    setMode("login");\n    setError(null);\n    setFieldError(null);\n  }\n'''
          if demo_fn not in text:
              raise SystemExit('Expected fillDemo block not found')
          text = text.replace(demo_fn, '')
          marker = '      {/* Demo credentials */}'
          idx = text.find(marker)
          if idx < 0:
              raise SystemExit('Demo credentials block not found')
          # Keep everything through the form and component closing, remove demo panel + DemoButton helper.
          prefix = text[:idx]
          tail_start = text.find('    </div>\n  );\n}\n\nfunction DemoButton', idx)
          if tail_start < 0:
              raise SystemExit('DemoButton helper boundary not found')
          text = prefix + '    </div>\n  );\n}\n'
          auth.write_text(text)

          page = Path('src/app/login/page.tsx')
          text = page.read_text()
          text = text.replace('import { db } from "@/db";\nimport { users } from "@/db/schema";\nimport { sql } from "drizzle-orm";\n', '')
          old = '''  const [[userCount], settings] = await Promise.all([\n    db.select({ n: sql<number>`count(*)::int` }).from(users),\n    getSettings(),\n  ]);\n  const hasUsers = (userCount?.n || 0) > 0;\n'''
          if old not in text:
              raise SystemExit('Expected login user-count block not found')
          text = text.replace(old, '  const settings = await getSettings();\n')
          old_call = '<AuthForm hasUsers={hasUsers} showDemoAccounts={process.env.NODE_ENV !== "production"} />'
          if old_call not in text:
              raise SystemExit('Expected AuthForm demo call not found')
          text = text.replace(old_call, '<AuthForm />')
          page.write_text(text)

          seed = Path('src/lib/seed.ts')
          if not seed.exists():
              raise SystemExit('Expected demo seed module not found')
          seed.unlink()
          PY

          if grep -R -n -E 'Demo-Only@2026|ceo@rsl\.gh|seedIfEmpty|Demo Accounts' src --exclude-dir=.next; then
            echo 'Demo runtime references remain in src/' >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit production-mode cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/inventory-production-data.yml
          rm -f .github/workflows/harden-production-mode.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove demo accounts and seed data from production system'
          git push origin HEAD:ops/remove-demo-data
