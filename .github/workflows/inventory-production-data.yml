name: Inventory production VIMS data

on:
  push:
    branches:
      - ops/remove-demo-data
    paths:
      - '.github/workflows/inventory-production-data.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Inventory production records
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          if (!process.env.DATABASE_URL) throw new Error('DATABASE_URL secret is missing');
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const tables = ['users','transporters','vehicles','inspections','locations','documents','notifications','audit_logs','import_jobs','rfid_tags','system_settings'];
          for (const table of tables) {
            const exists = await client.query('select to_regclass($1) as name', ['public.' + table]);
            if (!exists.rows[0]?.name) {
              console.log(`COUNT ${table}=MISSING`);
              continue;
            }
            const result = await client.query(`select count(*)::int as n from "${table}"`);
            console.log(`COUNT ${table}=${result.rows[0].n}`);
          }
          const demoEmails = ['ceo@rsl.gh','akosua@rsl.gh','kofi@rsl.gh','grace@rsl.gh','john@rsl.gh','ama@rsl.gh','yaw@rsl.gh','nana@rsl.gh','efua@rsl.gh','kwame@rsl.gh','daniel@metromass.gh'];
          const demoUsers = await client.query('select email, role, is_active from users where email = any($1::text[]) order by email', [demoEmails]);
          console.log(`DEMO_USER_MATCHES=${demoUsers.rowCount}`);
          for (const row of demoUsers.rows) console.log(`DEMO_USER email=${row.email} role=${row.role} active=${row.is_active}`);
          const demoTransporters = await client.query("select company_name from transporters where company_name = any($1::text[]) order by company_name", [["Metro Mass Transit Ltd","VIP Transport","Gold Coast Haulage","Western Express"]]);
          console.log(`DEMO_TRANSPORTER_MATCHES=${demoTransporters.rowCount}`);
          const demoVehicles = await client.query("select registration_number from vehicles where registration_number = any($1::text[]) order by registration_number", [["GT-1234-22","GT-5567-20","AS-9921-19","TT-3311-21","TT-7720-17","GR-1122-22","WR-4401-20","WR-5588-18"]]);
          console.log(`DEMO_VEHICLE_MATCHES=${demoVehicles.rowCount}`);
          const db = await client.query('select current_database() as db, current_user as usr');
          console.log(`DATABASE=${db.rows[0].db}`);
          await client.end();
          NODE
