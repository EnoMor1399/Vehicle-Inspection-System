name: Production database upgrade

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_VIMS_DB_UPGRADE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-db-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    name: Apply idempotent VIMS migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Require main ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production database upgrades may run only from refs/heads/main."
            exit 1
          fi

      - name: Validate confirmation
        shell: bash
        run: |
          if [[ "$DB_UPGRADE_CONFIRMATION" != "APPLY_VIMS_DB_UPGRADE" ]]; then
            echo "Confirmation does not match APPLY_VIMS_DB_UPGRADE."
            exit 1
          fi
        env:
          DB_UPGRADE_CONFIRMATION: ${{ inputs.confirmation }}

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Show migration plan
        shell: bash
        run: |
          echo "Migrations present in this release:"
          find migrations -maxdepth 1 -type f -name '*.sql' -print | sort

      - name: Apply database upgrades
        run: npm run db:upgrade
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Confirm production liveness
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            https://vehicle-inspection-system-sigma.vercel.app/api/health/live

      - name: Confirm production database readiness
        shell: bash
        run: |
          node <<'NODE'
          const url = "https://vehicle-inspection-system-sigma.vercel.app/api/health";
          let last = null;
          for (let attempt = 1; attempt <= 5; attempt += 1) {
            try {
              const response = await fetch(url, { headers: { "cache-control": "no-cache" } });
              const body = await response.json();
              last = { http: response.status, status: body?.status, database: body?.checks?.database?.status };
              console.log(`Readiness attempt ${attempt}:`, JSON.stringify(last));
              if (response.ok && body?.status === "healthy" && body?.checks?.database?.status === "healthy") {
                process.exit(0);
              }
            } catch (error) {
              last = { error: error instanceof Error ? error.message : String(error) };
              console.log(`Readiness attempt ${attempt}:`, JSON.stringify(last));
            }
            await new Promise((resolve) => setTimeout(resolve, 4000));
          }
          console.error("Production readiness did not become healthy:", JSON.stringify(last));
          process.exit(1);
          NODE
