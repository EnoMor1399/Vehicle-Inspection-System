name: Diagnose production Super Admin login

on:
  workflow_dispatch:
    inputs:
      super_admin_email:
        description: "Super Administrator email to diagnose"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diagnose-production-super-admin
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Require main ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production administrator diagnosis may run only from refs/heads/main."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify administrator and recent login results
        run: node scripts/diagnose-super-admin-login.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPER_ADMIN_EMAIL: ${{ inputs.super_admin_email }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_SUPER_ADMIN_PASSWORD }}
