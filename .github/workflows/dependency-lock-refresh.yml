name: Temporary VIMS security lockfile refresh
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - package.json
      - .github/workflows/dependency-lock-refresh.yml
permissions:
  contents: write
jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/vims-paystack-security-audit-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout same-repository security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from reviewed manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to the security branch
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches the manifest."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate locked patched dependencies"
          git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
      - name: Recheck production dependency advisory status
        run: |
          npm ci --ignore-scripts --no-fund
          npm run security:audit
