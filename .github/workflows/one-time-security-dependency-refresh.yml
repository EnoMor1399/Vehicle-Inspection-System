name: One-time VIMS dependency security refresh

on:
  push:
    branches:
      - hardening/enterprise-v2.5-assessment-remediation

permissions:
  contents: write

concurrency:
  group: one-time-vims-security-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Refresh patched Next.js and matching lint config
        run: |
          npm install --save-exact next@16.3.8
          npm install --save-dev --save-exact eslint-config-next@16.3.8

      - name: Apply non-breaking transitive security fixes
        shell: bash
        run: |
          # npm audit fix exits non-zero when lower-severity findings remain.
          # The next step is the release gate and still blocks high/critical findings.
          npm audit fix || true

      - name: Require no high or critical dependency findings
        run: npm audit --audit-level=high

      - name: Restrict generated changes to dependency manifests
        shell: bash
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE '^(package\.json|package-lock\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit refreshed dependency lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "Patch October 2026 dependency security advisories"
          git push origin "HEAD:${GITHUB_REF_NAME}"
