name: Post-deployment verification

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "HTTPS base URL of the deployed VIMS environment"
        required: true
        type: string
      expected_version:
        description: "Expected VIMS release version"
        required: true
        default: "2.5.0"
        type: string

permissions:
  contents: read

concurrency:
  group: production-post-deploy-verification
  cancel-in-progress: false

jobs:
  scope:
    name: Resolve production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_verify: ${{ steps.resolve.outputs.should_verify }}
      base_url: ${{ steps.resolve.outputs.base_url }}
      deployment_ref: ${{ steps.resolve.outputs.deployment_ref }}
      deployment_state: ${{ steps.resolve.outputs.deployment_state }}
      is_main: ${{ steps.resolve.outputs.is_main }}
    steps:
      - name: Resolve deployment event scope
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_BASE_URL: ${{ inputs.base_url }}
          DEFAULT_PRODUCTION_BASE_URL: https://vehicle-inspection-system-racoon-projects.vercel.app
        run: |
          node <<'NODE'
          const fs = require("fs");

          (async () => {
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const eventName = process.env.GITHUB_EVENT_NAME || "";
          const githubRef = process.env.GITHUB_REF || "";
          const githubRefName = process.env.GITHUB_REF_NAME || "";
          const repository = process.env.GITHUB_REPOSITORY || "";
          const deploymentRef = String(event.deployment?.ref || "");
          const deploymentSha = String(event.deployment?.sha || process.env.GITHUB_SHA || "");
          const deploymentState = String(event.deployment_status?.state || "");

          async function currentMainSha() {
            if (!repository || !process.env.GH_TOKEN) return "";
            try {
              const response = await fetch(`https://api.github.com/repos/${repository}/git/ref/heads/main`, {
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${process.env.GH_TOKEN}`,
                  "X-GitHub-Api-Version": "2022-11-28",
                },
              });
              if (!response.ok) return "";
              const body = await response.json();
              return String(body?.object?.sha || "");
            } catch {
              return "";
            }
          }

          function usableDeploymentUrl(value) {
            if (!value) return "";
            try {
              const url = new URL(value);
              if (url.protocol !== "https:") return "";
              if (url.hostname === "vercel.com" || url.hostname.endsWith(".vercel.com")) return "";
              return url.origin;
            } catch {
              return "";
            }
          }

          const mainSha = await currentMainSha();
          const isMain =
            githubRef === "refs/heads/main" ||
            githubRefName === "main" ||
            deploymentRef === "main" ||
            Boolean(deploymentSha && mainSha && deploymentSha === mainSha);

          let shouldVerify = false;
          let baseUrl = "";

          if (eventName === "workflow_dispatch") {
            if (!isMain) {
              console.error("Manual production verification may run only from main.");
              process.exit(1);
            }
            baseUrl = usableDeploymentUrl(process.env.MANUAL_BASE_URL);
            if (!baseUrl) {
              console.error("Manual VIMS base URL must be a valid HTTPS application URL.");
              process.exit(1);
            }
            shouldVerify = true;
          } else if (eventName === "deployment_status") {
            const environmentUrl = usableDeploymentUrl(event.deployment_status?.environment_url);
            const targetUrl = usableDeploymentUrl(event.deployment_status?.target_url);
            const fallbackUrl = usableDeploymentUrl(process.env.DEFAULT_PRODUCTION_BASE_URL);
            baseUrl = environmentUrl || targetUrl || fallbackUrl;
            shouldVerify = deploymentState === "success" && isMain && Boolean(baseUrl);
          }

          console.log(JSON.stringify({
            eventName,
            githubRef,
            githubRefName,
            deploymentRef,
            deploymentSha,
            mainSha,
            deploymentState,
            baseUrl,
            shouldVerify,
          }));

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_verify=${shouldVerify}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `base_url=${baseUrl}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment_ref=${deploymentRef}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment_state=${deploymentState}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `is_main=${isMain}\n`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

  verify:
    name: Verify VIMS liveness and readiness
    needs: scope
    if: needs.scope.outputs.should_verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Require resolved main deployment
        shell: bash
        env:
          RESOLVED_MAIN: ${{ needs.scope.outputs.is_main }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            if [[ "$RESOLVED_MAIN" != "true" ]]; then
              echo "Production verification may run only for a resolved main deployment."
              exit 1
            fi
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Verify deployed release without changing it
        run: node scripts/post-deploy-smoke.mjs
        env:
          VIMS_BASE_URL: ${{ needs.scope.outputs.base_url }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
