name: Post-deployment verification

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "HTTPS base URL of the deployed VIMS environment"
        required: true
        type: string
      expected_version:
        description: "Expected VIMS release version"
        required: true
        default: "2.5.0"
        type: string

permissions:
  contents: read

concurrency:
  group: production-post-deploy-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify VIMS liveness and readiness
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production' &&
       github.event.deployment.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Require main ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Production verification may run only from refs/heads/main."
              exit 1
            fi
          fi
          if [[ "$EVENT_NAME" == "deployment_status" && "$DEPLOYMENT_REF" != "main" ]]; then
            echo "Ignoring a non-main deployment."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Verify deployed release without changing it
        run: node scripts/post-deploy-smoke.mjs
        env:
          VIMS_BASE_URL: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.environment_url || inputs.base_url }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
