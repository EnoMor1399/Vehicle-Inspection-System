name: One-time VIMS Enterprise database migration

on:
  push:
    branches:
      - upgrade/enterprise-v2.3-interface-redesign
    paths:
      - .github/workflows/migrate-vims-v23-database.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout validated V2.3 branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/enterprise-v2.3-interface-redesign

      - name: Require database secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL GitHub Actions secret is not configured. No migration was attempted."
            exit 1
          fi
          echo "DATABASE_URL secret is available."

      - name: Install dependencies
        run: npm ci

      - name: Verify expected VIMS base schema
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const pg = require('pg');
          const cs = process.env.DATABASE_URL;
          const client = new pg.Client({
            connectionString: cs,
            ssl: /sslmode=(require|verify-ca|verify-full)/i.test(cs) ? { rejectUnauthorized: false } : undefined,
          });
          (async () => {
            await client.connect();
            try {
              const result = await client.query(`
                SELECT
                  to_regclass('public.users') AS users,
                  to_regclass('public.transporters') AS transporters,
                  to_regclass('public.vehicles') AS vehicles,
                  to_regclass('public.system_settings') AS system_settings
              `);
              const row = result.rows[0];
              const missing = Object.entries(row).filter(([, value]) => !value).map(([key]) => key);
              if (missing.length) throw new Error(`Expected VIMS base tables are missing: ${missing.join(', ')}`);
              console.log('Expected VIMS base schema verified.');
            } finally {
              await client.end();
            }
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Apply enterprise migrations
        run: node scripts/apply-enterprise-upgrade.mjs

      - name: Verify migrated schema
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const pg = require('pg');
          const cs = process.env.DATABASE_URL;
          const client = new pg.Client({
            connectionString: cs,
            ssl: /sslmode=(require|verify-ca|verify-full)/i.test(cs) ? { rejectUnauthorized: false } : undefined,
          });
          (async () => {
            await client.connect();
            try {
              const column = await client.query(`
                SELECT 1 FROM information_schema.columns
                WHERE table_schema='public' AND table_name='users' AND column_name='transporter_id'
              `);
              const index = await client.query(`
                SELECT 1 FROM pg_indexes
                WHERE schemaname='public' AND tablename='users' AND indexname='user_transporter_idx'
              `);
              const fk = await client.query(`
                SELECT 1 FROM pg_constraint
                WHERE conname='users_transporter_id_transporters_id_fk'
              `);
              const rfid = await client.query(`SELECT to_regclass('public.rfid_tags') AS table_name`);
              const settings = await client.query(`SELECT MIN(password_min_length) AS min_length FROM system_settings`);

              if (!column.rowCount) throw new Error('users.transporter_id was not created');
              if (!index.rowCount) throw new Error('user_transporter_idx was not created');
              if (!fk.rowCount) throw new Error('users transporter foreign key was not created');
              if (!rfid.rows[0].table_name) throw new Error('rfid_tags table is missing');
              if (settings.rows[0].min_length !== null && Number(settings.rows[0].min_length) < 12) throw new Error('password_min_length was not raised to at least 12');

              console.log('Enterprise migration verification passed.');
            } finally {
              await client.end();
            }
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
