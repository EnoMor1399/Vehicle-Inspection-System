name: Validate inspection actions

on:
  push:
    branches:
      - fix/inspection-actions-new-button
    paths:
      - '.github/workflows/validate-inspection-actions.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/inspection-actions-new-button
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
