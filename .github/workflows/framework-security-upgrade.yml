name: Framework security upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/framework-security-upgrade.yml"

permissions:
  contents: write

concurrency:
  group: framework-security-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Prepare framework security upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Upgrade secured framework baseline
        run: |
          npm install --save-exact next@16.3.3
          npm install --save-dev --save-exact eslint-config-next@16.3.3 postcss@8.5.26

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Validate ESLint
        run: npm run lint

      - name: Commit lockfile generated by npm
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already match the secured baseline."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js security baseline"
          git push origin HEAD:main
