name: Validate offline banner status fix

on:
  push:
    branches:
      - fix/offline-banner-live-status
    paths:
      - '.github/workflows/validate-offline-banner.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/offline-banner-live-status
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
