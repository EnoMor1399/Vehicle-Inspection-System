name: One-time Drizzle esbuild advisory remediation

on:
  push:
    branches:
      - security/resolve-drizzle-esbuild-advisory

permissions:
  contents: write

concurrency:
  group: one-time-drizzle-esbuild-remediation
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Re-resolve dependency tree with patched esbuild override
        run: npm install --ignore-scripts --force

      - name: Verify vulnerable esbuild is gone
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const legacy = lock.packages?.["node_modules/@esbuild-kit/core-utils/node_modules/esbuild"]?.version || null;
          const root = lock.packages?.["node_modules/esbuild"]?.version || null;
          console.log(JSON.stringify({ legacyEsbuild: legacy, rootEsbuild: root }));
          if (legacy) {
            console.error(`Unexpected nested esbuild remains: ${legacy}`);
            process.exit(1);
          }
          if (root !== "0.28.2") {
            console.error(`Expected root esbuild 0.28.2, found ${root}`);
            process.exit(1);
          }
          NODE

      - name: Enforce VIMS dependency security policy
        run: npm run security:audit

      - name: Commit lockfile refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change to commit."
            exit 0
          fi
          git commit -m "Refresh lockfile for patched Drizzle esbuild override"
          git push origin "HEAD:${GITHUB_REF_NAME}"
